services:
  plumb:
    build: .
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PLUMB_PROVIDER: ${PLUMB_PROVIDER:-groq}
      PLUMB_MODEL: ${PLUMB_MODEL:-openai/gpt-oss-20b}
      PLUMB_CUSTOM_URL: ${PLUMB_CUSTOM_URL:-}
      PLUMB_CUSTOM_KEY: ${PLUMB_CUSTOM_KEY:-}
      PLUMB_CUSTOM_MODEL: ${PLUMB_CUSTOM_MODEL:-}
      PLUMB_ALLOW_PRIVATE_ENDPOINTS: ${PLUMB_ALLOW_PRIVATE_ENDPOINTS:-}
